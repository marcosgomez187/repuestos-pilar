<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">Filtro de aceite y filtro de aire</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2029"/><stop offset="1" stop-color="#33404f"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9720a"/><stop offset=".45" stop-color="#ffc24d"/><stop offset="1" stop-color="#d9720a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8794"/><stop offset=".4" stop-color="#f1f4f8"/><stop offset="1" stop-color="#7d8794"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="170" fill="#fff" opacity=".04"/>

