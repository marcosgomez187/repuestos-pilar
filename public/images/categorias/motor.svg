<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">Pistón con biela y engranaje</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1a17"/><stop offset="1" stop-color="#3b3129"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8794"/><stop offset=".4" stop-color="#f1f4f8"/><stop offset="1" stop-color="#7d8794"/></linearGradient>
    <radialGradient id="steel" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f1f4f8"/><stop offset=".55" stop-color="#a9b2be"/><stop offset="1" stop-color="#64707e"/></radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="450" cy="120" r="150" fill="#ffb020" opacity=".08"/>

  <!-- engranaje -->
  <circle cx="150" cy="215" r="68" fill="none" stroke="#a9b2be" stroke-width="20" stroke-dasharray="13.35 13.35"/>
  <circle cx="150" cy="215" r="64" fill="url(#steel)"/>
  <circle cx="150" cy="215" r="44" fill="none" stroke="#5b6572" stroke-width="3"/>
  <circle cx="150" cy="215" r="22" fill="#2a2320"/>
  <circle cx="150" cy="215" r="10" fill="#cfd6df"/>

  <!-- biela -->
  <path d="M368 200H412L424 318H356Z" fill="url(#metal)"/>
  <circle cx="390" cy="335" r="46" fill="url(#steel)"/>
  <circle cx="390" cy="335" r="24" fill="#2a2320"/>
  <circle cx="390" cy="335" r="46" fill="none" stroke="#5b6572" stroke-width="3"/>
  <circle cx="358" cy="335" r="5" fill="#3a424e"/><circle cx="422" cy="335" r="5" fill="#3a424e"/>

  <!-- pistón -->
  <rect x="326" y="80" width="128" height="136" rx="12" fill="url(#metal)"/>
  <rect x="326" y="80" width="128" height="16" rx="8" fill="#fff" opacity=".35"/>
  <g stroke="#2a2320" stroke-width="6" stroke-linecap="round" opacity=".85">
    <path d="M326 112H454M326 128H454M326 144H454"/>
  </g>
  <circle cx="390" cy="186" r="18" fill="#2a2320"/>
  <circle cx="390" cy="186" r="10" fill="#cfd6df"/>
</svg>
