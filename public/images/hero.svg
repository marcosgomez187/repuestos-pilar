<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">Auto rojo de perfil junto a un engranaje</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#242e40"/><stop offset="1" stop-color="#0e1218"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4503f"/><stop offset="1" stop-color="#a51b10"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9cde6"/><stop offset="1" stop-color="#37536f"/></linearGradient>
    <radialGradient id="steel" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f1f4f8"/><stop offset=".55" stop-color="#a9b2be"/><stop offset="1" stop-color="#606a78"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a6" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/></radialGradient>
    <mask id="arches"><rect width="1200" height="800" fill="#fff"/><circle cx="380" cy="585" r="98" fill="#000"/><circle cx="830" cy="585" r="98" fill="#000"/></mask>
    <clipPath id="wellclip"><rect width="1200" height="585"/></clipPath>
    <g id="wheel">
      <circle r="82" fill="#0b0d11"/>
      <circle r="72" fill="none" stroke="#1a1e26" stroke-width="4"/>
      <circle r="56" fill="url(#steel)"/>
      <circle r="36" fill="none" stroke="#2a313c" stroke-width="22" stroke-dasharray="27 18.2"/>
      <circle r="56" fill="none" stroke="#5a6472" stroke-width="3"/>
      <circle r="16" fill="#d6dce4"/>
      <circle r="6" fill="#2a313c"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- engranaje decorativo -->
  <g fill="none" stroke="#fff" opacity=".07">
    <circle cx="960" cy="220" r="230" stroke-width="50" stroke-dasharray="36.1 36.1"/>
    <circle cx="960" cy="220" r="200" stroke-width="40"/>
    <circle cx="960" cy="220" r="90" stroke-width="30"/>
  </g>
  <g fill="none" stroke="#ffb020" opacity=".9" stroke-linecap="round" stroke-width="7">
    <path d="M70 470h130" opacity=".35"/><path d="M40 510h150" opacity=".55"/><path d="M90 550h100" opacity=".35"/>
  </g>

  <!-- piso -->
  <rect y="667" width="1200" height="133" fill="#0a0d12"/>
  <rect y="667" width="1200" height="4" fill="#d92b20"/>
  <ellipse cx="610" cy="672" rx="470" ry="16" fill="#000" opacity=".55"/>

  <!-- pasos de rueda -->
  <g clip-path="url(#wellclip)" fill="#07090c">
    <circle cx="380" cy="585" r="98"/><circle cx="830" cy="585" r="98"/>
  </g>

  <!-- carrocería -->
  <g mask="url(#arches)">
    <path d="M200 585V515Q200 488 232 483L335 468 402 402Q418 388 445 388H690Q722 390 748 416L808 470 958 488Q1012 494 1016 535V585Z" fill="url(#body)"/>
    <path d="M205 530H1012" stroke="#6f130a" stroke-width="3" opacity=".55"/>
    <path d="M232 486L335 471M450 391H688" stroke="#fff" stroke-width="3" opacity=".35" fill="none"/>
    <rect x="200" y="566" width="816" height="19" fill="#7a150c" opacity=".55"/>
  </g>

  <!-- vidrios y detalles -->
  <path d="M414 470L449 405H586V470Z" fill="url(#glass)"/>
  <path d="M604 405H684Q705 406 724 425L772 470H604Z" fill="url(#glass)"/>
  <path d="M596 470V572" stroke="#7a150c" stroke-width="3"/>
  <rect x="552" y="490" width="32" height="8" rx="4" fill="#dfe4ea"/>
  <rect x="612" y="490" width="32" height="8" rx="4" fill="#dfe4ea"/>
  <path d="M738 468l26-3 4 15-28 3z" fill="#c72b1e"/>
  <rect x="200" y="497" width="18" height="34" rx="6" fill="#ff6f61" stroke="#7a150c" stroke-width="2"/>
  <circle cx="990" cy="518" r="46" fill="url(#glow)"/>
  <ellipse cx="988" cy="518" rx="24" ry="11" fill="#fff2c4"/>
  <rect x="1000" y="548" width="16" height="30" rx="4" fill="#161b23"/>

  <!-- ruedas -->
  <use href="#wheel" x="380" y="585"/>
  <use href="#wheel" x="830" y="585"/>
</svg>
