<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="cerrarMenu()" aria-label="RepuestosPilar, ir al inicio">
      <img src="/images/logo-rp.png" width="114" height="44" alt="" />
      <span class="brand-text">
        <strong>Repuestos<span class="brand-accent">Pilar</span></strong>
        <small>Autopartes originales</small>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="menu-principal"
      [attr.aria-expanded]="menuAbierto()"
      (click)="alternarMenu()"
    >
      <span class="visually-hidden">{{ menuAbierto() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="menu-icon" aria-hidden="true"></span>
    </button>

    <nav id="menu-principal" class="main-nav" [class.open]="menuAbierto()" aria-label="Principal">
      <ul>
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="cerrarMenu()">Inicio</a>
        </li>
        <li><a routerLink="/productos" routerLinkActive="active" (click)="cerrarMenu()">Productos</a></li>
        <li><a routerLink="/nosotros" routerLinkActive="active" (click)="cerrarMenu()">Quiénes somos</a></li>
        <li><a routerLink="/contacto" routerLinkActive="active" (click)="cerrarMenu()">Contacto</a></li>
      </ul>
      <a class="btn btn-primary header-cta" [href]="'tel:' + site.phone.tel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
        {{ site.phone.display }}
      </a>
    </nav>
  </div>
</header>
